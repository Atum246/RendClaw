version: "3.8"

services:
  rendclaw:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OPENCLAW_VERSION: latest
    ports:
      - "10000:10000"
    env_file:
      - .env
    environment:
      - NEOCLAW_PLATFORM=local
    volumes:
      - rendclaw-workspace:/root/.openclaw/workspace
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  rendclaw-workspace:
    driver: local
