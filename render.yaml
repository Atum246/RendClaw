# ============================================================
# 🎨🦞 RendClaw — Render Blueprint
# Deploy OpenClaw on Render with one click
# ============================================================

services:
  # ─── Main RendClaw Service ─────────────────────────────────
  - type: web
    name: rendclaw
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free                    # Free tier! 🆓
    autoDeploy: true              # Auto-deploy on git push
    envVars:
      # Required (user must set these)
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: "anthropic/claude-sonnet-4-6"
      - key: GATEWAY_TOKEN
        generateValue: true       # Render auto-generates if not set

      # Platform detection
      - key: NEOCLAW_PLATFORM
        value: "render"

      # Render-specific
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: rendclaw
          property: host

      # Backup — GitHub Gist (REQUIRED for Render free tier — no persistent disk!)
      - key: GITHUB_GIST_TOKEN
        sync: false
        # ⚠️ Set this! Without it, your workspace is lost on every restart.
        # Get a token at https://github.com/settings/tokens with 'gist' scope.
      - key: GITHUB_GIST_ID
        sync: false
      - key: BACKUP_ENABLED
        value: "true"
      - key: SYNC_INTERVAL
        value: "120"

      # Optional — uncomment and set as needed
      # - key: TELEGRAM_BOT_TOKEN
      #   sync: false
      # - key: TELEGRAM_USER_ID
      #   sync: false
      # - key: WHATSAPP_ENABLED
      #   value: "false"
      # - key: DISCORD_TOKEN
      #   sync: false
      # - key: WEBHOOK_URL
      #   sync: false
      # - key: UPTIMEROBOT_API_KEY
      #   sync: false

    # Health check
    healthCheckPath: /health

    # NOTE: No disk block — Render free tier doesn't support persistent disks.
    # Workspace is backed up via workspace-sync.py (GitHub Gist, HF, or S3).
