# ============================================================
# 🎨🦞 RendClaw — Render Blueprint
# Deploy OpenClaw on Render with one click
# ============================================================

# How Render shows env vars in the deploy form:
#   sync: false          → shows as blank field for user to fill
#   value: "default"     → hidden, uses default (user can change later in dashboard)
#   generateValue: true  → hidden, Render auto-generates

services:
  - type: web
    name: rendclaw
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    envVars:
      # ─── User MUST fill these in the deploy form ─────────
      - key: LLM_API_KEY
        sync: false
      - key: GITHUB_GIST_TOKEN
        sync: false

      # ─── Pre-filled defaults (user can change in dashboard after deploy) ───
      - key: LLM_MODEL
        sync: false
      - key: GATEWAY_TOKEN
        generateValue: true
      - key: NEOCLAW_PLATFORM
        value: "render"
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: rendclaw
          property: host

      # ─── Backup (auto-configured) ───────────────────────
      - key: BACKUP_ENABLED
        value: "true"
      - key: SYNC_INTERVAL
        value: "120"

      # ─── Optional channels (set in Render dashboard after deploy) ───
      - key: TELEGRAM_BOT_TOKEN
        value: ""
      - key: TELEGRAM_USER_ID
        value: ""
      - key: WHATSAPP_ENABLED
        value: "false"
      - key: DISCORD_TOKEN
        value: ""

      # ─── Optional monitoring (set in Render dashboard after deploy) ───
      - key: UPTIMEROBOT_API_KEY
        value: ""
      - key: CRONJOB_ORG_KEY
        value: ""

    healthCheckPath: /health
